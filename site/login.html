<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Acesso ao painel e à agenda.">
    <title>Entrar</title>
    <link rel="stylesheet" href="/vendor/pico.min.css">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="auth-page">
    <!--
      THESIS: uma entrada comum e silenciosa, com o formulário no centro e a cor apenas como orientação espacial.
      OWN-WORLD: fundo neutro, uma faixa lateral sólida e controles sem decoração; sem marca, logo ou seletor de perfil.
      STORY: informar a credencial cadastrada, autenticar e seguir para a área permitida por aquele login.
      FIRST VIEWPORT: cartão único centralizado, título Entrar, dois campos, ação primária e mensagens de estado.
      FORM: login centralizado e direto; o tipo é resolvido pelo cadastro/credencial, não por uma escolha na tela.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <main class="auth-shell">
      <section class="auth-panel" aria-labelledby="login-title">
        <div class="auth-panel-toolbar">
          <span aria-hidden="true"></span>
          <button class="theme-toggle" data-theme-toggle type="button"><span class="theme-label">Tema</span></button>
        </div>
        <div class="auth-panel-heading">
          <h1 id="login-title">Entrar</h1>
          <p id="login-description">Use o e-mail ou usuário cadastrado.</p>
        </div>
        <form id="login-form" class="auth-form">
          <label id="login-identity-label" for="login-identity">E-mail ou usuário</label>
          <input id="login-identity" type="text" autocomplete="username" spellcheck="false" placeholder="Digite sua credencial" required>
          <label for="login-password">Senha</label>
          <div class="password-field">
            <input id="login-password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button id="toggle-password" type="button" aria-label="Mostrar senha"><span class="password-toggle-label">Mostrar</span></button>
          </div>
          <button id="login-submit" class="auth-submit" type="submit">Entrar</button>
          <p id="login-error" class="form-message error" role="alert"></p>
        </form>
        <section id="login-config-alert" class="auth-config-alert" hidden role="alert" aria-live="polite">
          <strong>Login indisponível</strong>
          <p id="login-config-message">Configure o relay central antes de liberar o acesso.</p>
          <div class="auth-config-actions"><a class="secondary-button" href="/deploy">Configurar relay</a><button id="retry-config" class="secondary-button" type="button">Tentar novamente</button></div>
        </section>
        <div id="login-security-note" class="auth-panel-foot">
          <p id="login-note">A área exibida depende da conta autenticada.</p>
        </div>
      </section>
    </main>
    <script src="/site.js" defer></script>
    <script src="/auth.js" defer></script>
    <script src="/login.js" defer></script>
  </body>
</html>

<main class="login-shell">
      <header class="login-topbar" aria-label="Status do sistema e preferências">
        <p class="system-status"><span class="status-dot" aria-hidden="true"></span> Ambiente protegido</p>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="true" aria-label="Ativar tema claro">
          <i class="ph ph-sun" aria-hidden="true"></i>
          <span class="theme-toggle-label">Claro</span>
        </button>
      </header>

      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-lockup" aria-label="Fecart AI Share">
          <img class="brand-logo" src="/assets/fecart-logo.png" alt="">
          <p class="brand-name">Fecart <span>AI</span> Share</p>
        </div>

        <div class="login-heading">
          <h1 id="login-title">Entrar</h1>
          <p>Entre com o acesso da sua equipe</p>
        </div>

        <section id="login-notice" class="login-notice" hidden role="alert" aria-live="polite">
          <span class="notice-icon" aria-hidden="true"><i class="ph ph-info"></i></span>
          <div class="notice-copy">
            <strong id="notice-title">Atenção</strong>
            <p id="notice-message"></p>
            <button id="retry-config" class="notice-action" type="button" hidden>Tentar novamente</button>
          </div>
          <button id="notice-close" class="notice-close" type="button" aria-label="Fechar aviso">
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
        </section>

        <form id="login-form" class="login-form" novalidate autocomplete="on">
          <div class="form-field" data-field="identity">
            <label for="login-identity">Grupo ou e-mail</label>
            <div class="input-wrap">
              <i class="ph ph-envelope-simple input-icon" aria-hidden="true"></i>
              <input id="login-identity" name="identity" type="text" inputmode="email" autocomplete="username" spellcheck="false" placeholder="Ex.: grupo-01 ou seu e-mail" required>
            </div>
            <p class="field-message" data-message-for="identity" aria-live="polite"></p>
          </div>

          <div class="form-field" data-field="password">
            <label for="login-password">Senha</label>
            <div class="input-wrap">
              <i class="ph ph-lock-key input-icon" aria-hidden="true"></i>
              <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
              <button id="toggle-password" class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                <i class="ph ph-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p class="field-message" data-message-for="password" aria-live="polite"></p>
          </div>

          <div class="form-options">
            <span aria-hidden="true"></span>
            <button id="forgot-password" class="text-link" type="button">Esqueceu sua senha?</button>
          </div>

          <button id="login-submit" class="login-submit" type="submit">
            <span class="submit-label">Entrar</span>
            <i class="ph ph-arrow-right submit-arrow" aria-hidden="true"></i>
            <span class="button-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <div class="card-security">
          <i class="ph ph-shield-check" aria-hidden="true"></i>
          <span>Acesso protegido e temporário</span>
        </div>
      </section>

      <footer class="login-footer">
        <span>Fecart AI Share</span>
        <span class="footer-separator" aria-hidden="true">•</span>
        <span>Uso autorizado</span>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
